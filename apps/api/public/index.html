<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パシャカロ API</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        color: #f5f5f7;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { font-size: 14px; line-height: 1.7; color: #b8b8c0; margin: 6px 0; }
      code {
        background: #1c1c1f;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>パシャカロ API</h1>
      <p>このサーバーはパシャカロ(写真AI食事記録アプリ)のバックエンドAPIです。</p>
      <p>稼働確認: <code>/health</code> にアクセスすると <code>{"status":"ok"}</code> が返ります。</p>
      <p>アプリのUIはモバイル(Webデモ)側のURLからご利用ください。</p>
    </main>
  </body>
</html>
